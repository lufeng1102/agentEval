name: AgentEval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agenteval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Run AgentEval
        run: |
          PYTHONPATH=src python -m cli run \
            --dataset examples/datasets/basic_agent_eval.yaml \
            --config examples/configs/static_eval.yaml \
            --out runs/latest \
            --min-pass-rate 0.5 \
            --min-score 0.5 \
            --fail-on-error
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenteval-reports
          path: runs/latest
