[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenteval"
version = "0.1.0"
description = "A Python evaluation framework for Claude/LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AISpeech" }]
dependencies = [
  "anthropic>=0.74.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.40",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
agenteval = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "anthropic_live: tests that call the live Anthropic API and require ANTHROPIC_API_KEY",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
